# Sveltia CMS configuration (Decap/Netlify-CMS-compatible format).
# Edits here map to the Astro content collections in src/content.config.ts —
# keep the fields in sync or builds will fail.

backend:
  name: github
  # Repo coordinates. Currently the personal account; migrate to a society org
  # (e.g. SwanseaUniEsports/su-esports-website) once the org exists.
  repo: KRUZZZZY/su-esports-website
  branch: main

# Uploaded images land here and are served at /images/...
media_folder: "public/images"
public_folder: "/images"

site_url: https://swanseauniesports.co.uk

collections:
  - name: committee
    label: "Committee"
    label_singular: "Committee member"
    folder: "src/content/committee"
    create: true
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role", widget: string }
      - { name: ign, label: "In-game name", widget: string, required: false }
      - { name: photo, label: "Photo", widget: image, required: false }
      - { name: socials, label: "Social link", widget: string, required: false }

  - name: events
    label: "Events"
    label_singular: "Event"
    folder: "src/content/events"
    create: true
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: endDate, label: "End date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: game, label: "Game", widget: string, required: false }
      - { name: location, label: "Location", widget: string, required: false }
      - { name: image, label: "Thumbnail", widget: image, required: false }
      - { name: link, label: "Sign-up link", widget: string, required: false }
      - { name: description, label: "Short description", widget: string, required: false }
      - { name: body, label: "Details", widget: markdown, required: false }
      - { name: draft, label: "Draft (hidden from site)", widget: boolean, default: false, required: false }

  - name: news
    label: "News"
    label_singular: "News post"
    folder: "src/content/news"
    create: true
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: author, label: "Author", widget: string, default: "Swansea Esports" }
      - { name: excerpt, label: "Excerpt", widget: string, required: false }
      - { name: image, label: "Image", widget: image, required: false }
      - { name: draft, label: "Draft", widget: boolean, default: false }
      - { name: body, label: "Body", widget: markdown, required: false }

  - name: placements
    label: "Achievements"
    label_singular: "Placement"
    folder: "src/content/placements"
    create: true
    fields:
      - { name: year, label: "Year", widget: number, value_type: int }
      - { name: competition, label: "Competition", widget: string }
      - { name: game, label: "Game", widget: string }
      - { name: medal, label: "Medal", widget: select, options: ["1st", "2nd", "3rd"], default: "1st" }

  - name: rankings
    label: "Season Rankings"
    label_singular: "Ranking"
    folder: "src/content/rankings"
    create: true
    fields:
      - { name: season, label: "Season", widget: string }
      - { name: placement, label: "Placement", widget: string }
      - { name: order, label: "Order", widget: number, value_type: int, default: 99, hint: "Lower number shows higher (1 = most recent)" }

  - name: reps
    label: "Game Reps"
    label_singular: "Game rep"
    folder: "src/content/reps"
    create: true
    fields:
      - { name: game, label: "Game", widget: string }
      - { name: name, label: "Name", widget: string, hint: "\"TBC\" if vacant" }
      - { name: ign, label: "In-game name", widget: string, required: false }
